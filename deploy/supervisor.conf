# Supervisor 配置文件
# 文件路径: /etc/supervisor/conf.d/county_real_estate.conf

[program:county_real_estate]
; 项目目录
directory=/www/wwwroot/county-real-estate/backend

; 启动命令
command=/www/wwwroot/county-real-estate/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2

; 运行用户
user=root

; 自动启动
autostart=true

; 自动重启
autorestart=true

; 启动延迟（秒）
startsecs=10

; 停止等待时间（秒）
stopwaitsecs=60

; 停止信号
stopsignal=TERM

; 重定向输出
stdout_logfile=/www/wwwroot/county-real-estate/logs/supervisor_stdout.log
stderr_logfile=/www/wwwroot/county-real-estate/logs/supervisor_stderr.log

; 日志文件大小
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB

; 日志文件备份数
stdout_logfile_backups=10
stderr_logfile_backups=10

; 环境变量文件
environment=PYTHONUNBUFFERED="1"
