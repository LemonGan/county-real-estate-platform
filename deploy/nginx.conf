# 县域房产平台 - 生产环境 Nginx 配置
# 文件路径: /www/server/panel/vhost/nginx/buyhouse_api.conf

# HTTP → 自动跳转 HTTPS
server {
    listen 80;
    server_name 8.138.129.142;

    # 日志
    access_log /www/wwwlogs/buyhouse_api_access.log;
    error_log /www/wwwlogs/buyhouse_api_error.log;

    # 强制跳转 HTTPS
    return 301 https://$host$request_uri;
}

# HTTPS 主配置
server {
    listen 443 ssl http2;
    server_name 8.138.129.142;

    # SSL证书 (宝塔面板自动生成路径)
    ssl_certificate    /www/server/panel/vhost/cert/8.138.129.142/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/8.138.129.142/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5;

    # 日志
    access_log /www/wwwlogs/buyhouse_api_access.log;
    error_log /www/wwwlogs/buyhouse_api_error.log;

    # API 反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时配置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 健康检查
    location /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # 静态文件
    location /static/ {
        alias /www/wwwroot/my_work/buyHouse/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 上传文件大小限制
    client_max_body_size 10M;
}
