# 县域房产平台 Nginx 配置
# 文件路径: /www/server/panel/vhost/nginx/county_real_estate.conf

server {
    listen 80;
    server_name 8.138.129.142;

    # 日志配置
    access_log /www/wwwlogs/county_real_estate_access.log;
    error_log /www/wwwlogs/county_real_estate_error.log;

    # 前端静态文件（如果有H5版本）
    # location / {
    #     root /www/wwwroot/county-real-estate/frontend/dist;
    #     index index.html;
    #     try_files $uri $uri/ /index.html;
    # }

    # API反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时配置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 后端文档和健康检查
    location /docs {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /redoc {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # 静态文件服务
    location /static/ {
        alias /www/wwwroot/county-real-estate/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 上传文件大小限制
    client_max_body_size 10M;
}

