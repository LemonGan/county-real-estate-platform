# Alembic Configuration File
[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Database URL (will be overridden by environment variable)
# The real URL is read from backend/.env by alembic/env.py.
# This placeholder prevents credentials from being committed to Git.
sqlalchemy.url = mysql+pymysql://USER:PASSWORD@localhost:3306/buyhouse_db

# Logging Configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
